<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepyummy | Composer & Producer</title>
    
    <!-- Animated GIF Favicon -->
    <link rel="icon" type="image/gif" href="favicon.gif">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hidden Audio for "Prime Time" Reveal -->
    <audio id="bg-music" loop>
        <source src="primetime.wav" type="audio/wav">
    </audio>

    <nav>
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">MUSIC</a>
        <a href="#">GAMING</a>
        <a href="#">RESEARCH</a>
        <!-- Animated Wave Bars -->
        <div class="music-container">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <span id="music-text">PRIME TIME</span>
        </div>
    </nav>

    <header class="hero">
        <h1>SLEEPYUMMY</h1>
        <p>MUSICIAN | PRODUCER | RESEARCHER</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>SCIENTIFIC RESEARCH</h2>
            <p>Author of **The Silver Apron Theory**, exploring universal expansion and black holes.</p>
        </section>

        <section class="card">
            <h2>MUSIC PRODUCTION</h2>
            <p>Composer and Arranger. Composed OST for Electrify.</p>
            <a href="https://www.youtube.com/@ilikeoilandsleep" class="btn">VIEW WORKS</a>
        </section>
    </main>

    <script>
    var music = document.getElementById("bg-music");
    var container = document.querySelector(".music-container");
    var hasStarted = false;

    function startVibe() {
        if (!hasStarted) {
            hasStarted = true;
            // Set volume to 0.25 so it's clear but not peaking
            music.volume = 0.25; 
            
            music.play().then(() => {
                container.classList.add("playing");
            }).catch(e => {
                hasStarted = false; 
                console.log("Interaction still needed by browser");
            });
            
            ["mousedown", "keydown"].forEach(event => {
                window.removeEventListener(event, startVibe);
            });
        }
    }

    // Seamless loop logic: jump back 0.1s before the actual end
    music.addEventListener('timeupdate', function() {
        if (this.currentTime > this.duration - 0.1) {
            this.currentTime = 0;
            this.play();
        }
    });

    // High-intent listeners
    window.addEventListener('mousedown', startVibe);
    window.addEventListener('keydown', startVibe);
    </script>
</body>
</html>
